name: Python harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    name: Python harness checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Install isolated development package
        run: python -m pip install --timeout 15 --retries 0 -e ".[dev]"
      - name: Import installed package
        run: python -c "import personalstyle; from importlib.metadata import version; print(version('personalstyle'))"
      - name: CLI help
        run: personalstyle --help
      - name: Non-generation startup
        run: personalstyle --config personalstyle.toml
      - name: Smoke tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Dependency consistency
        run: python -m pip check
      - name: Patch whitespace
        run: git diff --check HEAD^ HEAD
