name: Python harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python smoke tests (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - documents-profile
          - provider-learning
          - protocol-storage
          - feedback-security
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Install isolated development package
        run: python -m pip install --timeout 15 --retries 0 -e ".[dev]"
      - name: Verify shard coverage
        run: python scripts/run_pytest_shard.py --check
      - name: Smoke tests
        run: python scripts/run_pytest_shard.py --shard ${{ matrix.shard }}

  quality:
    name: Python static and startup checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Install isolated development package
        run: python -m pip install --timeout 15 --retries 0 -e ".[dev]"
      - name: Import installed package
        run: python -c "import personalstyle; from importlib.metadata import version; print(version('personalstyle'))"
      - name: CLI help
        run: personalstyle --help
      - name: Non-generation startup
        run: personalstyle --config personalstyle.toml
      - name: Lint
        run: python -m ruff check src tests scripts/run_pytest_shard.py
      - name: Type check
        run: python -m mypy src
      - name: Dependency consistency
        run: python -m pip check
      - name: Patch whitespace
        run: git diff --check HEAD^ HEAD

  harness:
    name: Python harness checks
    if: always()
    needs: [python-tests, quality]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Require all test shards and quality checks
        shell: pwsh
        env:
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if ($env:PYTHON_TESTS_RESULT -ne 'success' -or $env:QUALITY_RESULT -ne 'success') {
            Write-Error "Python test shards: $env:PYTHON_TESTS_RESULT; quality checks: $env:QUALITY_RESULT"
            exit 1
          }
          Write-Output 'All Python test shards and quality checks passed.'
