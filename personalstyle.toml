[project]
name = "personalstyle"
environment = "local"

# Version contracts are specified here before they are mechanized.
# The Python/core package product version remains authoritative in pyproject.toml.
[versions]
protocol = "1.0"
config_schema = 1
storage_schema = 1
profile_schema = 1
prompt_contract = 1
compatibility_policy = "same-major-capability-negotiated"

[model]
provider = "ollama"
model = "qwen3:30b"
temperature = 0.2
max_tokens = 2000

[harness]
max_generation_attempts = 3
# Initial safety defaults inherited from the repository baseline; not validated as optimal.
max_total_model_calls = 8
timeout_seconds = 60

[context]
explicit_context_required = true
max_examples = 5
max_context_tokens = 6000

[retrieval]
strategy = "metadata"
embeddings_enabled = false
vector_database_enabled = false

[agent]
enabled = false
max_strategy_steps = 3

[verification]
semantic_required = true
required_information_required = true
constraint_required = true
structural_required = true
context_required = true
style_is_hard_gate = false

[storage]
backend = "sqlite"
path = "data/personalstyle.db"

[security]
companion_mode_enabled = false
default_network_scope = "loopback"
network_clients_require_auth = true
remote_transport_requires_encryption = true
browser_origin_validation_required = true
secrets_in_config_allowed = false
application_level_storage_encryption = false

[scheduling]
enabled = false

[logging]
level = "INFO"
store_prompts = false
store_outputs = false
